  const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}

  return FEAT.some(f=>
    String(f.Division||'').toLowerCase()==='entertainment' &&
    String(f.Tier||'').toLowerCase()===tier &&
    String(f.Feature||'').trim().toLowerCase()===name.toLowerCase() &&
    String(f.Included||'').trim().toUpperCase()==='Y');
}

function meets(req){
  if(req==='always')return true;
  if(req==='ent.any')return has(Q['Entertainment Plan']);
  if(req.indexOf('ent.feat:')===0)return entFeat(req.slice(9));
  if(req==='photo.coverage')return has(Q['Photo Tier'])||has(Q['Photo Plan']);
  if(req==='photo.video')return has(Q['Photo Video']);
  if(req==='photo.shoot')return has(Q['Photo Shoot']);
  if(req==='photo.prints')return has(Q['Photo Prints']);
  return false;
}

// ── render ──────────────────────────────────────────────────────────────────
function prefBlock(){
  const ev=Q['Event Date'], cr=Q['Created Date'];
  const evd=parseDate(ev), crd=parseDate(cr);
  if(!evd||!crd)return '';
  const days=Math.floor((Date.now()-crd.getTime())/864e5);
  if(days>=16)return '';
  const until=new Date(crd.getTime()+15*864e5);
  const D=fmtShort(ev), U=fmtShort(until.toISOString().slice(0,10));
  let cls='n', txt;
  if(days<=2){txt=t().prefA.replace('{d}',D);}
  else if(days<=13){txt=t().prefB.replace(/\{d\}/g,D).replace('{u}',U);}
  else {cls='s';txt=t().prefC.replace('{d}',D);}
  return '<div class="pref '+cls+'">'+txt+'</div>';
}

function moments(){
  const shown=[],up=[];
  SEQUENCE.forEach(m=>{ (meets(m.req)?shown:up).push(m); });
  let html='';
  BLOCKS.forEach(b=>{
    const list=shown.filter(m=>m.block===b.n);
    if(!list.length)return;
    html+='<div class="blk"><div class="blk-h"><div class="blk-n">'+b.n+'</div>'+
          '<div class="blk-t">'+esc(LANG==='es'?b.es:b.en)+'</div></div>';
    list.forEach(m=>{
      html+='<div class="mo"><div class="ph"><div class="ph-tag">'+m.id+'</div>'+
            '<div class="ph-i">Foto</div><div class="ph-s">'+esc(m.shot)+'</div></div>'+
            '<div class="mo-b"><div class="mo-t">'+esc(LANG==='es'?m.t_es:m.t_en)+'</div>'+
            '<div class="mo-d">'+esc(LANG==='es'?m.d_es:m.d_en)+'</div><div class="mo-s">'+
            m.chips.map(c=>'<span class="chip c-'+c+'">'+esc(t().cat[c])+'</span>').join('')+
            '</div></div></div>';
    });
    html+='</div>';
  });
  // Upsell: solo los que tienen texto propio de upsell. Un momento sin texto
  // simplemente no se menciona — no se le dice al cliente lo que no compro.
  const uo=up.filter(m=>m.u_es);
  let uh='';
  if(uo.length){
    uh='<div class="up"><div class="up-h">'+esc(t().uph)+'</div>'+
       '<div class="up-s">'+esc(t().ups)+'</div>';
    uo.forEach(m=>{
      uh+='<div class="up-i"><div class="up-n">'+esc(LANG==='es'?m.u_es:m.u_en)+'</div>'+
          '<div class="up-d">'+esc(LANG==='es'?m.ud_es:m.ud_en)+'</div></div>';
    });
    uh+='</div>';
  }
  return html+uh;
}

// ── Catering ────────────────────────────────────────────────────────────────
// Catering no tiene filas en Package_Features: su detalle se calcula del plan
// contratado y del numero de invitados. Es el mismo calculo que ya hace el PDF.
function cateringDetail(){
  const line=String(Q['Catering Line']||'').toLowerCase();
  const plan=String(Q['Catering Plan']||'').toLowerCase();
  if(!has(line)||!has(plan))return null;
  const tier=CTIERS.filter(function(t){
    return String(t.Line||'').toLowerCase()===line && String(t.Tier||'').toLowerCase()===plan;
  })[0];
  if(!tier)return null;

  // El nombre con que esta fila aparece en Catering_Quantities: las Classic
  // llevan la linea adelante, las demas van solas.
  const qName=String(tier.Line)==='Classic'
    ? String(tier.Line)+' '+String(tier.Tier) : String(tier.Tier);

  const head=(LANG==='es'&&tier.Includes_ES)?String(tier.Includes_ES):String(tier.Includes||'');
  const g=num(Q['Guests']);
  const rg=CRANGES.filter(function(x){return g>=num(x.Min)&&g<=num(x.Max);})[0];
  if(!rg)return {head:head,rows:[],tier:String(tier.Tier||'')};
  const R=String(rg.Range_ID);

  const rows=CQTY.filter(function(x){return String(x.Tier||'')===qName;});
  const srow=rows.filter(function(x){return String(x.Type||'')==='stars';})[0];
  const stars=srow?num(srow[R]):num(tier.Stars);
  // Menu fijo: las cantidades son bandejas de cocina, no elecciones del cliente.
  const fixed=String(tier.Model||'')==='fixed';

  const out=[];
  rows.forEach(function(x){
    const ty=String(x.Type||'');
    if(ty==='stars')return;
    const q=num(x[R]);
    if(!q)return;
    const cat=String(x.Category||'');
    const name=TX('catering',cat)||cat;
    let val, badge='';
    if(fixed||ty==='included'||q===1){ val=TX('phrase','included')||'Included'; }
    else { val=(TX('phrase','choose')||'choose {n}').replace('{n}',q); }
    if(ty==='mains'&&stars>0&&!fixed){
      const st=Math.min(stars,q);
      if(st){
        const k=st>1?'star_many':'star_one';
        badge=(TX('phrase',k)||('{n} Star Dish'+(st>1?'es':''))).replace('{n}',st);
      }
    }
    out.push({name:name,val:val,badge:badge});
  });
  return {head:head,rows:out,tier:String(tier.Tier||'')};
}

// Resumen por categoria, SIN precios.
//
// Cada categoria se despliega con TODO lo que el paquete incluye. Una lista
// larga de cosas concretas es lo que le da peso a la cotizacion.
//
// Dos reglas que el codigo tiene que respetar:
//  - Una categoria puede tener varias subdivisiones y CADA UNA lleva su propio
//    tier. Photo Coverage puede ser prestige y Photo Shoot legacy en la misma
//    cotizacion. Filtrar la categoria entera por un solo tier mostraba cosas
//    que la familia no compro: una clienta sin video veia las lineas de video.
//  - Una subdivision sin tier no aporta nada.
const SUMMARY=[
  {key:'venue', div:'Venue', head:'Venue Tier', subs:[['','Venue Tier']]},
  {key:'catering', div:'Catering', catering:true},
  {key:'decor', div:'Decor', head:'Decor Plan', subs:[
     ['Main Table','Decor Honor Tier'],['Centerpieces','Decor CP Tier'],
     ['Dining Table','Decor Dining Tier'],['Add-Ons','Decor Extras Tier']]},
  {key:'ent', div:'Entertainment', head:'Entertainment Plan', subs:[['','Entertainment Plan']]},
  {key:'photo', div:'Photo', head:'Photo Tier', subs:[
     ['Coverage','Photo Tier'],['Video','Photo Video'],['Photo Shoot','Photo Shoot']]}
];
const SUMCOL={venue:'var(--venue)',catering:'var(--cat)',decor:'var(--decor)',
              ent:'var(--ent)',photo:'var(--photo)'};

function featLinesFor(div,sub,tier,seen){
  return FEAT.filter(function(f){
    return String(f.Division||'').toLowerCase()===div.toLowerCase() &&
           String(f.Subdivision||'').toLowerCase()===String(sub||'').toLowerCase() &&
           String(f.Tier||'').toLowerCase()===String(tier||'').toLowerCase() &&
           String(f.Included||'').trim().toUpperCase()==='Y';
  }).map(function(f){
    const name=(LANG==='es'&&f.Feature_ES)?f.Feature_ES:f.Feature;
    const val =(LANG==='es'&&f.Value_ES)?f.Value_ES:f.Value;
    // Una categoria agrupa varias subdivisiones, asi que "Entrega / Galeria en
    // linea" puede venir tres veces. Repetir no suma peso, hace ver la lista
    // automatica. Se muestra una vez.
    const k=String(name)+'\u0000'+String(val||'');
    if(seen[k])return '';
    seen[k]=1;
    return '<div class="fl"><div class="fl-n">'+esc(name)+'</div>'+
           '<div class="fl-v">'+esc(val||'')+'</div></div>';
  }).join('');
}

function summary(){
  let h='';
  SUMMARY.forEach(function(d,i){
    let body='', head='';

    if(d.catering){
      const cd=cateringDetail();
      if(!cd)return;
      head=cd.tier;
      if(cd.head)body+='<div class="fhead">'+esc(cd.head)+'</div>';
      cd.rows.forEach(function(r){
        body+='<div class="fl"><div class="fl-n">'+esc(r.name)+'</div><div class="fl-v">'+
              esc(r.val)+(r.badge?'<span class="fbadge">'+esc(r.badge)+'</span>':'')+
              '</div></div>';
      });
      if(body)body+='<div class="fmenu"><a href="https://menu.cardonahall.com" target="_blank" rel="noopener">'+
                    esc(TX('phrase','see_menu')||'See the menu')+' &rarr;</a></div>';
    } else {
      head=String(Q[d.head]||'');
      if(!has(head))return;
      const seen={};
      d.subs.forEach(function(sp){
        const tier=String(Q[sp[1]]||'');
        if(!has(tier))return;
        body+=featLinesFor(d.div,sp[0],tier,seen);
      });
    }

    if(!has(head))return;
    h+='<div class="sr" id="sr'+i+'">'+
       '<div class="sr-head" onclick="document.getElementById(\'sr'+i+'\').classList.toggle(\'open\')">'+
       '<div class="sr-l"><div class="sr-h"><div class="sr-dot" style="background:'+SUMCOL[d.key]+'"></div>'+
       '<div class="sr-n">'+esc(t().cat[d.key])+'</div></div>'+
       '<div class="sr-t">'+esc(cap(head))+'</div></div>'+
       (body?'<div class="sr-x">+</div>':'')+'</div>'+
       (body?'<div class="sr-body">'+body+'</div>':'')+'</div>';
  });
  return h;
}

function prices(){
  const cats=['Price Venue','Price Catering','Price Decor','Price Entertainment','Price Photo'];
  const sub=cats.reduce((a,k)=>a+num(Q[k]),0);
  const fin=num(Q['Final Total'])||sub;
  const sav=Math.max(0,sub-fin);
  let h='<div class="pr">';
  if(sav>0)h+='<div class="pl"><div class="pl-l">'+esc(t().sep)+'</div><div class="pl-v">'+money(sub)+'</div></div>';
  h+='<div class="pl main"><div class="pl-l">'+esc(t().full)+'</div><div class="pl-v">'+money(fin)+'</div></div>';
  if(sav>0)h+='<div class="pl save"><div class="pl-l">'+esc(t().save)+'</div><div class="pl-v">'+money(sav)+'</div></div>';
  h+='<div class="pr-note">'+esc(t().note)+'</div></div>';
  return h;
}

// 'Full Package' guarda dos cosas segun la epoca del registro: el modelo nuevo
// escribe un Package_ID (PKG-QUI-PREMIER) y el viejo escribia un tier suelto
// (prestige). Hay que entender los dos o las cotizaciones de una u otra epoca
// se quedan sin nombre de paquete.
function pkgLevel(){
  const raw=String(Q['Full Package']||'').trim();
  if(!has(raw))return '';
  const u=raw.toUpperCase();
  if(u.indexOf('PKG-')===0){
    if(u.slice(-8)==='-PREMIER')return 'SIGNATURE';
    if(u.slice(-8)==='-CLASSIC')return 'CLASSIC';
    return '';
  }
  const t=raw.toLowerCase();
  return (t==='prestige'||t==='legacy')?'SIGNATURE':'CLASSIC';
}

function pkgName(){
  const lbl=String(Q['Event Sub-Type']||Q['Event Type']||'').trim();
  const lvl=pkgLevel();
  if(lvl){
    const m=LABELS.find(x=>String(x.Event_Label||'').trim().toLowerCase()===lbl.toLowerCase() &&
                            String(x.Level||'')===lvl);
    if(m&&m.Name)return m.Name;
  }
  return lbl;
}

  const guests=num(Q['Guests']), tables=num(Q['Tables']);
  let meta=fmtDate(Q['Event Date']);
  if(guests)meta+=' &nbsp;&middot;&nbsp; '+guests+' '+t().guests;
  if(tables)meta+=' &nbsp;&middot;&nbsp; '+tables+' '+t().tables;

  const html =
   (DEMO?'<div class="demo">DEMO &mdash; datos de ejemplo, sin token</div>':'')+
   '<div class="hero">'+
     '<div class="lang"><button onclick="setLang(\'es\')" class="'+(LANG==='es'?'on':'')+'">ES</button>'+
     '<button onclick="setLang(\'en\')" class="'+(LANG==='en'?'on':'')+'">EN</button></div>'+
     '<div class="mark">Cardona Hall</div>'+
     '<div class="pre">'+(LANG==='es'?'Para':'For')+'</div>'+
     '<div class="who">'+esc(Q['Client Name'])+'</div>'+
     '<div class="what">'+esc(pkgName())+'</div>'+
     '<div class="when">'+meta+'</div><div class="orn"></div>'+
   '</div>'+
   prefBlock()+
   '<div class="intro"><h2>'+esc(t().intro)+'</h2><p>'+esc(t().introd)+'</p></div>'+
   moments()+
   '<div class="sum"><div class="sum-h">'+esc(t().sumh)+'</div>'+
     '<div class="sum-s">'+esc(pkgName())+'</div>'+summary()+'</div>'+
   prices()+
   '<div class="close"><div class="close-t">'+
     (LANG==='es'?'Su fecha se reserva con&nbsp;$1,000':'Your date is held with&nbsp;$1,000')+
     '</div><div class="close-d">'+esc(t().closed)+'</div>'+
     '<button class="btn" onclick="book()">'+esc(t().book)+'</button>'+
     '<div class="close-s">'+esc(t().or)+' &nbsp;&middot;&nbsp; (862) 232-0117</div></div>'+
   '<div class="foot"><div class="foot-b">Cardona Hall</div>'+
     '<div class="foot-a">72 Hoover Ave, Passaic NJ &nbsp;&middot;&nbsp; cardonahall.com</div>'+
     '<div class="foot-r">Produced by Pilab Productions</div></div>';
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
}

function setLang(l){ LANG=l; render(); }
function book(){
  const msg=encodeURIComponent(LANG==='es'
    ? 'Hola, quiero reservar mi fecha para '+(Q['Event Date']||'')+'.'
    : 'Hi, I would like to hold my date for '+(Q['Event Date']||'')+'.');
  window.open('https://wa.me/18622320117?text='+msg,'_blank');
}

function fail(){
  document.getElementById('app').innerHTML=
    '<div class="msg"><b>'+esc(t().nf)+'</b>'+esc(t().nfd)+'<br><br>(862) 232-0117</div>';
}

// ── arranque ────────────────────────────────────────────────────────────────
async function boot(){
  const tok=new URLSearchParams(location.search).get('t');
  try{
    const [feat,labels,txt,ct,cq,cr]=await Promise.all([
      fetch(API+'?sheet=Package_Features').then(r=>r.json()),
      fetch(API+'?sheet=Package_Labels').then(r=>r.json()),
      fetch(API+'?sheet=UI_Text').then(r=>r.json()),
      fetch(API+'?sheet=Catering_Tiers').then(r=>r.json()),
      fetch(API+'?sheet=Catering_Quantities').then(r=>r.json()),
      fetch(API+'?sheet=Catering_Ranges').then(r=>r.json())
    ]);
    FEAT=Array.isArray(feat)?feat:[];
    LABELS=Array.isArray(labels)?labels:[];
    TXT=Array.isArray(txt)?txt:[];
    CTIERS=Array.isArray(ct)?ct.filter(function(x){return x&&x.Line;}):[];
    CQTY=Array.isArray(cq)?cq.filter(function(x){return x&&x.Tier;}):[];
    CRANGES=Array.isArray(cr)?cr.filter(function(x){return x&&x.Range_ID;}):[];
    if(tok){
      const q=await fetch(API+'?token='+encodeURIComponent(tok)).then(r=>r.json());
      if(!q||!q['Client Name'])return fail();
      Q=q;
    }else{
      DEMO=true; Q=SAMPLE;
    }
    render();
  }catch(e){ fail(); }
}
